name: VPN Gate Node Check

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r frontend/requirements.txt

      - name: Run vpngate pipeline
        env:
          WORKER_CHECK_URL: ${{ secrets.WORKER_CHECK_URL }}
          SSTP_USER: ${{ secrets.SSTP_USER }}
          SSTP_PASS: ${{ secrets.SSTP_PASS }}
        run: |
          cd frontend
          python vpngate.py

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          path: frontend/web/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/web
          destination_dir: .

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const msg = `VPN Gate 检测失败！\n仓库: ${context.repo.owner}/${context.repo.repo}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            console.log(msg);
